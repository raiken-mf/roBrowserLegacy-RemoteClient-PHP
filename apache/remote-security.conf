# Required server/vhost configuration. Define RC_BASE and RC_DIR before Include.
# RC_BASE is the URL prefix with a trailing slash (use / for the site root).
# RC_DIR is the absolute filesystem path to this RemoteClient installation.
# This configuration requires mod_rewrite and mod_authz_core.
RewriteEngine On
# Inspect the original request before Apache normalizes dot segments. PHP also
# validates the decoded path and resolves each candidate within its own root.
RewriteCond %{THE_REQUEST} "[[:space:]][^?[:space:]]*((%2e|[.])(%2e|[.])(/|%2f|%5c|[?[:space:]])|%25(25)*(2e|2f|5c))" [NC]
RewriteRule ^ - [F]
# Force all resource requests and API routes through the application even when
# a corresponding on-disk file exists. A missing rewrite module fails startup.
RewriteRule ^${RC_BASE}(data|SystemEN|System|AI|BGM)/ ${RC_BASE}index.php [PT,NC,E=RESOURCE_REQUEST:1]
RewriteRule ^${RC_BASE}api/ ${RC_BASE}index.php [PT,NC,E=RESOURCE_REQUEST:1]
ErrorDocument 404 ${RC_BASE}index.php
<Directory "${RC_DIR}">
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride None
    Require all denied
</Directory>
<LocationMatch "^${RC_BASE}index[.]php$">
    Require all granted
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Headers "*"
    </IfModule>
</LocationMatch>
