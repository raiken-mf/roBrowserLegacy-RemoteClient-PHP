name: Apache resource security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apache-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Build standalone Apache image
        run: docker build -f docker/apache/Dockerfile -t robrowser-php-standalone-test:local .
      - name: Test Apache, filesystem and encoding boundaries
        run: python3 tests/check-apache-http.py
